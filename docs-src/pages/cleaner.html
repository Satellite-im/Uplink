<p>Cleaner deletes conversations in bulk, by kind: spam, codes, sales, deliveries and the rest.</p>
<p>On from the start.</p>
<steps>
<step title="Tap the brush">
<p>It's in the list's header.</p>
<m-screen title="Messages" actions="brush-cleaning,settings"><m-p>Tap the brush in the header.</m-p></m-screen>
</step>
<step title="Tick the kinds, then Delete">
<m-screen>
  <m-sheet title="Clean up">
    <m-row icon="ban" hue="coral" label="Spam" value="41" switch="on" tap/>
    <m-row icon="key-round" hue="green" label="Codes" value="128" switch="on"/>
    <m-row icon="tag" hue="amber" label="Sales &amp; solicitors" value="31" switch="off"/>
    <m-btn kind="danger" icon="trash-2">Delete</m-btn>
  </m-sheet>
</m-screen>
</step>
</steps>
<note kind="warn" title="It can't be undone"><p>Cleaner deletes whole conversations from the phone, for every app. Archived conversations are left alone.</p></note>
