<!-- The outer screen: one conversation (test/shots/2-thread-*.png), the newest of it as a screen this short shows it,
     under the row its camera sits in.
     Each piece is the app's, drawn by the kit (site/mock/hero.css gives each its box); site/mock/hero.js makes the
     composer send, the chips type and the reactions bounce. -->
<div class="gm h3-pane" data-screen="cover" data-view="thread" data-hero>
  <div class="h3-l" data-name="header" data-z="2.2" style="left:0px;top:62px;width:412px"><div class="gm gm-fit gm-clear" data-mock="x-header"><div class="gm-stage">
  <header class="gm-head">
    <button class="gm-iconbtn" tabindex="-1" aria-label="Back"><svg class="gm-i"><use href="/mock/icons.svg#arrow-left"/></svg></button>
    <button class="gm-head__who" tabindex="-1">
      <span class="gm-av" data-hue="magenta" style="--size:33px">MC</span>
      <span class="gm-head__text"><span class="gm-head__name">Maya Chen</span><span class="gm-head__sub">+15551230001</span></span>
    </button>
    <span class="gm-head__actions">
      <button class="gm-iconbtn" tabindex="-1" aria-label="Call"><svg class="gm-i"><use href="/mock/icons.svg#phone"/></svg></button>
      <button class="gm-iconbtn" tabindex="-1" aria-label="Settings"><svg class="gm-i"><use href="/mock/icons.svg#settings"/></svg></button>
    </span>
  </header>
</div></div></div>
  <div class="h3-l" data-name="yours" data-z="1.5" style="left:82px;top:134px;width:321px"><div class="gm gm-fit gm-clear" data-mock="x-out1"><div class="gm-stage">
  <div class="gm-msg gm-msg--out" data-g="top"><div class="gm-bubble">Movie night is still on for tonight right?</div></div>
</div></div></div>
  <div class="h3-l" data-name="yours-last" data-z="1.5" style="left:212px;top:201px;width:191px"><div class="gm gm-fit gm-clear" data-mock="x-out2"><div class="gm-stage">
  <div class="gm-msg gm-msg--out" data-g="bottom"><div class="gm-bubble">Dinner at mine first?</div></div>
</div></div></div>
  <div class="h3-l" data-name="heart" data-z="1.9" style="left:222px;top:241px;width:30px"><div class="gm gm-fit gm-clear" data-mock="x-heart"><div class="gm-stage">
  <span class="gm-react">❤️</span>
</div></div></div>
  <div class="h3-l" data-name="receipt" data-z="1.15" style="left:260px;top:267px;width:140px"><div class="gm gm-fit gm-clear" data-mock="x-ticks"><div class="gm-stage">
  <div class="gm-msg gm-msg--out"><div class="gm-meta"><span class="gm-meta__lines"><span class="hero-edited">Edited · correction sent</span><span class="gm-row-flex"><span class="hero-state">Delivered · 11:27 PM</span>&nbsp;<svg class="gm-i gm-ticks"><use href="/mock/icons.svg#check-check"/></svg></span></span></div></div>
</div></div></div>
  <div class="h3-l" data-name="theirs" data-z="1.3" style="left:10px;top:305px;width:322px"><div class="gm gm-fit gm-clear" data-mock="x-in"><div class="gm-stage">
  <div class="gm-msg gm-msg--in" data-g="solo"><div class="gm-bubble">Sounds good, see you at 7! Bring the projector cable if you still have it</div></div>
</div></div></div>
  <div class="h3-l" data-name="laugh" data-z="1.75" style="left:291px;top:373px;width:31px"><div class="gm gm-fit gm-clear" data-mock="x-laugh"><div class="gm-stage">
  <span class="gm-react">😂</span>
</div></div></div>
  <div class="h3-l" data-name="emoji" data-z="1.0" style="left:17px;top:411px;width:99px"><div class="gm gm-fit gm-clear" data-mock="x-emoji"><div class="gm-stage">
  <div class="gm-msg gm-msg--in" data-g="solo"><div class="gm-jumbo"><span>🎉</span><span>🍿</span></div></div>
</div></div></div>
  <div class="h3-l" data-name="replies" data-z="0.8" style="left:10px;top:478px;width:248px"><div class="gm gm-fit gm-clear" data-mock="x-chips"><div class="gm-stage">
  <div class="gm-chips"><button class="gm-chip gm-chip--emoji" tabindex="-1">👍</button><button class="gm-chip" tabindex="-1">Sounds good</button><button class="gm-chip" tabindex="-1">Haha</button></div>
</div></div></div>
  <div class="h3-l" data-name="composer" data-z="0.6" style="left:10px;top:532px;width:393px"><div class="gm gm-fit gm-clear" data-mock="x-compose"><div class="gm-stage">
  <form class="gm-composer" data-gm-composer="">
    <button type="button" class="gm-composer__btn" tabindex="-1" aria-label="Add"><svg class="gm-i"><use href="/mock/icons.svg#plus"/></svg></button>
    <input class="gm-composer__input" tabindex="-1" placeholder="Text message" aria-label="Message" maxlength="48" autocomplete="off">
    <button type="button" class="gm-composer__btn" tabindex="-1" aria-label="Stickers"><svg class="gm-i"><use href="/mock/icons.svg#sticker"/></svg></button>
    <button type="button" class="gm-composer__btn gm-composer__mic" tabindex="-1" aria-label="Voice message"><svg class="gm-i"><use href="/mock/icons.svg#mic"/></svg></button>
    <button class="gm-composer__send" tabindex="-1" aria-label="Send"><svg class="gm-i"><use href="/mock/icons.svg#arrow-up"/></svg></button>
  </form>
</div></div></div>
</div>
